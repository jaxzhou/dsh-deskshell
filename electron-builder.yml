appId: com.deepseek.dsh.desktop
productName: DSH-D
copyright: Copyright © 2025 DSH-D

directories:
  output: release
  buildResources: assets

# Only the app sources and the manifest are packaged; devDependencies are not.
files:
  - src/**/*
  - assets/icon.png
  - assets/icon.icns
  - assets/icon.ico
  - package.json

asar: true

mac:
  category: public.app-category.developer-tools
  # A pre-built .icns avoids electron-builder downloading its icons tool
  # bundle from GitHub Releases (see scripts/make-icns.sh).
  icon: assets/icon.icns
  # No Apple Developer certificate available: build an unsigned local app.
  identity: null
  # Current architecture by default; add `--arm64` / `--x64` to build both.
  target:
    - dmg
    - zip

win:
  # A pre-built .ico avoids electron-builder downloading its icons tool
  # bundle from GitHub Releases (see scripts/make-ico.mjs).
  icon: assets/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64

nsis:
  # No spaces in the artifact name: it is served straight from a URL
  # (/download/DSH-D-Setup-0.1.0.exe), matching the site's links.
  artifactName: ${productName}-Setup-${version}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: DSH-D

linux:
  # A pre-built PNG size set avoids electron-builder downloading its icons
  # tool bundle from GitHub Releases (see scripts/make-icons.mjs).
  icon: assets/icons
  category: Development
  # Lower-case command name, as Linux conventions expect.
  executableName: dsh-d
  # Keep the generated .desktop file name in sync with desktopName, so desktop
  # environments associate the running window with this entry.
  syncDesktopName: true
  desktop:
    entry:
      Name: DSH-D
      Comment: DeepSeek Harness 桌面外壳
  target:
    - AppImage
    - deb
    - tar.gz

deb:
  # Debian packages require a maintainer with an email address.
  maintainer: JaxZhou <jaxzhou@hotmail.com>
